name: Android Package

on:
  workflow_dispatch:
  push:
    tags: ["v*-android"]
  pull_request:
    # Packaging is heavy, so it only runs for changes to this workflow itself.
    paths: [".github/workflows/mobile-package.yml"]

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_NDK_VERSION: 27.0.12077973
  NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
  CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
  CC_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
  CXX_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
  AR_aarch64_linux_android: /usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

jobs:
  package:
    name: Android package (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform and NDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android-aarch64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Initialize Android project
        run: pnpm tauri android init

      # Signing is optional: without these secrets the release artifacts stay
      # unsigned. When ANDROID_KEYSTORE_BASE64 is present, all four secrets are
      # required, and the APK is verified after the build.
      - name: Configure signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret; the release artifacts will be unsigned."
            exit 0
          fi
          missing=""
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set but these secrets are missing:$missing" >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/taleno-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.gradle/init.d"
          cp scripts/android-signing.init.gradle "$HOME/.gradle/init.d/taleno-signing.gradle"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Keystore configured; the release APK and AAB will be signed."

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --ci --apk --aab --target aarch64

      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -n 1)"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taleno-android-${{ steps.signing.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
